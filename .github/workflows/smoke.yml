name: Smoke test

# Runs the APK on Android emulators, walks through setup and the main screens, and saves
# screenshots and any crash to the smoke-results-<api> branch.
on:
  push:
    branches-ignore: ["smoke-results-*"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces an older run (they would otherwise race to publish the same branches).
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Emulator (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # A phone-sized screen in dark mode, the same in light mode, and a small old phone.
          - { api: 35, profile: pixel_6, night: "yes" }
          - { api: 30, profile: pixel_6, night: "no" }
          - { api: 28, profile: "", night: "no" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('build.sh') }}

      - name: Build APK
        run: ./build.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk through the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: NIGHT=${{ matrix.night }} bash scripts/smoke.sh

      - name: Publish results
        if: always()
        env:
          API: ${{ matrix.api }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-smoke.sh
